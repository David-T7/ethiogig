version: '3.8'

services:
  app:
    build:
      context: .
    image: ethiogig-backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - dev-static-data:/vol/web
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py wait_for_redis &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
      - THEORETICAL_TEST_SERVICE_URL=http://localhost:8001
      - PRACTICAL_TEST_SERVICE_URL=http://localhost:8002
      - SURVEILLANCE_SERVICE_URL=http://localhost:8003
      - KYC_SERVICE_URL=http://localhost:8005
    depends_on:
      - db
      - redis

  db:
    image: postgres:16.3-alpine3.20
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme 

  redis:
    image: redis:6.2-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  celery:
    image: ethiogig-backend
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py wait_for_redis &&
             celery -A ethiogig worker --loglevel=info"
    volumes:
      - ./app:/app
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
      - THEORETICAL_TEST_SERVICE_URL=http://localhost:8001
      - PRACTICAL_TEST_SERVICE_URL=http://localhost:8002
      - SURVEILLANCE_SERVICE_URL=http://localhost:8003
      - KYC_SERVICE_URL=http://localhost:8005
    depends_on:
      - db
      - redis

  celery-beat:
    image: ethiogig-backend
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py wait_for_redis &&
             celery -A ethiogig beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - ./app:/app
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
      - THEORETICAL_TEST_SERVICE_URL=http://localhost:8001
      - PRACTICAL_TEST_SERVICE_URL=http://localhost:8002
      - SURVEILLANCE_SERVICE_URL=http://localhost:8003
      - KYC_SERVICE_URL=http://localhost:8005
    depends_on:
      - db
      - redis

volumes:
  dev-db-data:
  dev-static-data:
  redis-data:
